name: Rebuild product image manifest

on:
  push:
    paths:
      - 'images/products/**'

permissions:
  contents: write

jobs:
  rebuild-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Una importación editorial ya incluye el manifiesto exacto: no reordenarlo.
      - name: Detect curated manifest
        id: curated
        run: |
          if git show --format= --name-only HEAD | grep -qx 'data/images-manifest.json'; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild manifest
        if: steps.curated.outputs.updated != 'true'
        run: node scripts/build-image-manifest.mjs

      - name: Check catalog before committing manifest
        run: node scripts/check-catalog.mjs

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- data/images-manifest.json; then
            echo "Manifest unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images-manifest.json
          git commit -m "chore: rebuild product image manifest"
          git push
