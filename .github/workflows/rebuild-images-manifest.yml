name: Rebuild product image manifest

on:
  push:
    paths:
      - 'images/products/**'

permissions:
  contents: write

jobs:
  rebuild-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild manifest
        run: node scripts/build-image-manifest.mjs

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- data/images-manifest.json; then
            echo "Manifest unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images-manifest.json
          git commit -m "chore: rebuild product image manifest"
          git push
