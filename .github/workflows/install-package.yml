name: Install optimized catalog package

on:
  push:
    branches: [codex/optimizar-catalogo-imagenes-v2]
    paths: ['.codex-upload/**']

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify package
        run: |
          cat .codex-upload/part-* > /tmp/gma-site.zip
          echo "$(cat .codex-upload/sha256)  /tmp/gma-site.zip" | sha256sum -c -
          mkdir /tmp/gma-site
          unzip -q /tmp/gma-site.zip -d /tmp/gma-site
      - name: Replace branch contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/gma-site/. .
          node scripts/build-image-manifest.mjs
          test "$(find images/products -type f | wc -l)" -eq 632
          test "$(node -e "const m=require('./data/images-manifest.json'); console.log(Object.keys(m).length)")" -eq 540
      - name: Commit optimized catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimizar catálogo, imágenes y auditoría"
          git push
