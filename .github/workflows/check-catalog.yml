name: Comprobar catálogo

on:
  push:
    paths:
      - 'index.html'
      - 'nuevo/**'
      - 'assets/**'
      - 'package*.json'
      - 'data/**'
      - 'images/products/**'
      - 'images/thumbnails/**'
      - 'scripts/**'
      - '.github/workflows/check-catalog.yml'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
