  <text x="92" y="230" class="title" fill="#11110f"><tspan x="92" dy="0">Canelon de Pollo con Trufa</tspan></text><line x1="92" y1="348" x2="1108" y2="348" stroke="#dfe6df" stroke-width="3"/>
  <g transform="translate(92 395)"><text class="label">Peso medio</text><text class="value" y="44" style="font-size:34px"><tspan x="0" dy="0">130 g/unidad</tspan></text></g><g transform="translate(612 395)"><text class="label">Formato</text><text class="value" y="44" style="font-size:34px"><tspan x="0" dy="0">30 unidades/caja</tspan></text></g><g transform="translate(92 507)"><text class="label">Conservación</text><text class="value" y="44" style="font-size:34px"><tspan x="0" dy="0">−18 °C</tspan></text></g><g transform="translate(612 507)"><text class="label">Preparación</text><text class="value" y="44" style="font-size:27px"><tspan x="0" dy="0">Descongelar; horno 8–10</tspan><tspan x="0" dy="33">min o microondas 1–3 min</tspan></text></g>
